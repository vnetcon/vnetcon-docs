# Projektin faktat — jokainen sessio lukee tämän ensin
#
# /vnetcon-init täyttää tämän kartoituksen perusteella. Pidä lyhyenä (< 100
# riviä) mutta täsmällisenä: tämä on se, mistä agentti tietää missä mikä on,
# ilman että sen tarvitsee arvata.
#
# Tätä EI generoida automaattisesti uudelleen. Jos projektin rakenne muuttuu
# (uusi moduuli, kehysvaihdos), päivitä tämä käsin tai aja /vnetcon-init uudelleen.

paivitetty: TÄYTTÄMÄTÖN

projekti:
  nimi: TÄYTTÄMÄTÖN
  kuvaus: ""              # 1–2 lausetta: mitä projekti tekee
  juuri: ".."
  versionhallinta: git
  paahaara: main

pino:
  profiilit: []           # metodi/pinot/<nimi>.md — mitkä kartoitusprofiilit ovat käytössä
  kielet: []
  kehykset: []
  tietokanta: ""
  viestinvalitys: ""      # esim. sqs, kafka, rabbitmq, ei mitään
  ajoympäristö: ""        # esim. AWS Lambda, Kubernetes, palvelin

# Miten moduuli tunnistetaan tässä projektissa ja mitä jätetään pois.
moduulijako:
  tunnistus: ""           # esim. "hakemisto, jossa on package.json"
  poisrajaukset: []       # esim. [node_modules, generated, kokeilut/]
  perustelu: ""           # miksi juuri tämä jako

# Missä mikä on. Vain merkittävät — ei koko hakemistopuuta.
hakemistokartta: []
  # - polku: src/api
  #   vastuu: HTTP-rajapinta ja reititys
  # - polku: db/migrations
  #   vastuu: tietokantaskeema (Flyway)

# Mistä datan muoto määräytyy — datamallien lähteet.
skeemalahteet: []
  # - polku: openapi.yaml
  #   tyyppi: openapi
  # - polku: prisma/schema.prisma
  #   tyyppi: orm

# Sisääntulopistetyypit, joita projektissa esiintyy.
sisaantulot: []           # esim. [rest, viestijono, ajastus, cli]

# Komennot, joita tiketin toteutus (vaihe 4) käyttää.
komennot:
  testi: ""
  build: ""
  lint: ""
  paikallinen_ajo: ""
  huomio: ""              # esim. "testit vaativat käynnissä olevan Postgresin (docker compose up db)"

# TESTIEN LÄHTÖTASO — mikä testipaketin tulos oli ENNEN kuin mihinkään koskettiin.
#
# Tämä ei valtuuta mitään. Se on pelkkä tulkinta-avain, jotta tiketin vaihe 4 voi
# raportoida totuudenmukaisesti: ilman sitä agentti näkee hylätyt testit eikä
# pysty erottamaan itse aiheuttamiaan ennestään punaisista.
#
# `ennestaan_punaiset` on JOUKKO, ei lukumäärä. Pelkkä luku päästää läpi
# tilanteen, jossa yksi vanha punainen korjaantuu ja yksi uusi rikkoutuu:
# yhteismäärä ei muutu, mutta jotain rikkoutui.
#
# Kirjataan käyttöönotossa (I6) ja virkistetään /synkronoi-dokumentaatio (S4).
testit:
  lahtotaso: ""           # vihrea | osin-punainen | ei-ajettavissa | ei-ajettu
  pvm: ""                 # milloin todettu
  git-viite: ""           # minkä HEADin kohdalla
  lapi: 0
  ohitettu: 0
  ennestaan_punaiset: []  # tunnistettava nimi per rivi — ei pelkkä lukumäärä
    # - "spec/maksut/refund_spec.rb:12 palauttaa osittaisen hyvityksen"
    # - "e2e/checkout.spec.ts vahvistaa tilauksen"
  huomio: ""              # esim. "ei ajettu: vaatii Postgresin, jota ei ollut käytettävissä"

# Olemassa oleva dokumentaatio, johon linkitetään (ei duplikoida).
olemassa_oleva_dokumentaatio: []
  # - polku: docs/adr
  #   sisalto: arkkitehtuuripäätökset

# Asiat, jotka toistuvasti hämäävät — kirjaa ne heti kun huomaat.
huomiot: []
